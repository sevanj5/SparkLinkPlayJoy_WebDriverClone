<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V2 macro probe (read-only)</title>
<style>
  :root { color-scheme: light dark; --bg:#fafafa; --fg:#1d1d1f; --mut:#6b6b70; --card:#fff; --line:#d8d8de; --acc:#2563eb; --ok:#15803d; --bad:#b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16161a; --fg:#ececf0; --mut:#9a9aa3; --card:#202026; --line:#34343c; --acc:#6ea0ff; --ok:#4ade80; --bad:#f87171; } }
  body { margin:0; padding:24px; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:880px; margin:0 auto; display:grid; gap:16px; }
  h1 { font-size:20px; margin:0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .badge { display:inline-block; font-size:12px; padding:2px 8px; border-radius:999px; border:1px solid var(--ok); color:var(--ok); }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:8px; }
  button { font:inherit; padding:6px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
  button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  input[type=number] { width:70px; font:inherit; padding:5px 8px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  label { color:var(--mut); }
  pre { margin:0; padding:12px; border-radius:8px; background:var(--bg); border:1px solid var(--line); overflow:auto; max-height:480px; font:12.5px/1.45 ui-monospace, Menlo, Consolas, monospace; white-space:pre-wrap; word-break:break-all; }
  .mut { color:var(--mut); } .ok { color:var(--ok); } .bad { color:var(--bad); }
</style>
</head>
<body>
<main>
  <div>
    <h1>Keyboard V2 macro probe <span class="badge">read-only</span></h1>
    <p class="mut">Sends only read queries (macro space info, macro mode, macro data). Every frame is checked against a read-only allowlist before it is sent; write commands cannot be sent from this page.</p>
  </div>

  <section class="card">
    <strong>1. Connect</strong>
    <div class="row">
      <button class="primary" id="connect">Select keyboard…</button>
      <label><input type="checkbox" id="allHid"> show all HID interfaces (use if the keyboard isn't listed)</label>
    </div>
    <p id="deviceInfo" class="mut">No device selected.</p>
  </section>

  <section class="card">
    <strong>2. Read</strong>
    <div class="row">
      <button id="space" disabled>Query macro space</button>
      <label>macro ID <input type="number" id="macroId" min="0" max="255" value="0"></label>
      <button id="mode" disabled>Read mode</button>
      <label>offset <input type="number" id="offset" min="0" max="255" value="0"></label>
      <button id="data" disabled>Read data</button>
      <button id="all" disabled>Read all macros</button>
    </div>
  </section>

  <section class="card">
    <div class="row" style="margin-top:0">
      <strong>Log</strong>
      <button id="copy">Copy log</button>
      <button id="clear">Clear</button>
    </div>
    <pre id="log" class="mut">Nothing yet.</pre>
  </section>
</main>
<script type="module" src="./macro-probe.mjs"></script>
</body>
</html>
